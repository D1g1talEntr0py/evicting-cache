name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: pnpm
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.10.1
      - run: sudo npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: node --test .github/scripts/release-version.check.mjs
      - name: Determine release version
        id: release
        run: |
          VERSION=$(node .github/scripts/release-version.mjs)
          if [[ -z "$VERSION" ]]; then
            echo "No version bump required"
            exit 0
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare, validate, and publish release
        if: steps.release.outputs.version != ''
        env:
          VERSION: ${{ steps.release.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git-cliff --github-repo "$GITHUB_REPOSITORY" --tag "v$VERSION" --unreleased --strip header --output "$RUNNER_TEMP/release-notes.md"
          git-cliff --github-repo "$GITHUB_REPOSITORY" --tag "v$VERSION" --output CHANGELOG.md
          npm version "$VERSION" --no-git-tag-version --ignore-scripts
          pnpm audit
          pnpm lint
          pnpm type-check
          pnpm test:coverage
          pnpm build
          pnpm pack --pack-destination "$RUNNER_TEMP"
          PACKAGE="$RUNNER_TEMP/evicting-cache-$VERSION.tgz"
          tar -tzf "$PACKAGE" | grep -Fx 'package/dist/evicting-cache.js'
          tar -tzf "$PACKAGE" | grep -Fx 'package/dist/evicting-cache.d.ts'
          tar -tzf "$PACKAGE" | grep -Fx 'package/CHANGELOG.md'
          PACKAGE="$PACKAGE" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { mkdtempSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const directory = mkdtempSync(join(tmpdir(), 'evicting-cache-package-'));
          execFileSync('tar', ['-xzf', process.env.PACKAGE, '-C', directory]);
          const { EvictingCache } = await import(pathToFileURL(join(directory, 'package/dist/evicting-cache.js')));
          const cache = new EvictingCache(1);
          cache.put('first', 1);
          cache.put('second', 2);
          assert.equal(cache.get('first'), null);
          assert.equal(cache.get('second'), 2);
          NODE
          npm publish "$PACKAGE" --provenance --access public
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md package.json
          git commit -m "chore(release): $VERSION [skip ci]"
          git tag "v$VERSION"
          git push --atomic origin HEAD:main "v$VERSION"
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" "$PACKAGE"
